[workspace]
members = ["crates/vprouter-core", "crates/vprouter-linux", "crates/vprouter", "crates/vprouter-netfilter", "crates/vprouter-network", "crates/vprouter-launch", "crates/vprouter-worker", "crates/vprouter-native-role"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
rustix = { version = "=1.1.4", features = ["fs", "process", "net", "event", "time"] }
clap = { version = "=4.6.7", features = ["derive"] }
sha2 = "=0.11.1"
tokio = { version = "=1.53.3", features = ["rt", "net", "time", "macros", "io-util"] }
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
netlink-packet-core = "=0.9.0"
netlink-packet-route = "=0.33.0"
netlink-packet-generic = "=0.5.0"
netlink-packet-wireguard = "=0.5.0"
x25519-dalek = "=3.0.0"
zeroize = "=1.9.1"

rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.11"
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
