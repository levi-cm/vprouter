[package]
name = "vprouter-launch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
vprouter-core = { path = "../vprouter-core" }
vprouter-linux = { path = "../vprouter-linux" }
serde.workspace = true
serde_json.workspace = true
rustix = { workspace=true, features=["mount", "thread"] }
sha2.workspace = true
tokio.workspace = true
libc = "=0.2.189"

[[bin]]
name = "vprouter-launch-admit"
path = "src/main.rs"

[[test]]
name = "admission_lab"
path = "src/lab_main.rs"
harness = false

[[test]]
name = "execution_probe"
path = "src/execution_probe_main.rs"
harness = false

[[test]]
name = "execution_lab"
path = "src/execution_lab_main.rs"
harness = false
